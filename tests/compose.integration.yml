services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: disposable-test-only
      MYSQL_ROOT_HOST: "%"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../QETG.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent && mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM test.quiz LIMIT 1'"]
      interval: 3s
      timeout: 5s
      retries: 60
  integration:
    build:
      context: ..
      dockerfile: tests/integration.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
