services:
  app:
    command: ["sh", "/var/www/html/tests/run-ci.sh"]
    environment:
      QETG_ENV_CONFIG: "0"
      DB_PASSWORD: local-development-only-change-me
    restart: "no"
    volumes:
      - ./tests:/var/www/html/tests:ro
  db:
    environment:
      MYSQL_PASSWORD: local-development-only-change-me
      MYSQL_ROOT_PASSWORD: disposable-test-only
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./QETG.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
